name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.13"
      - name: Install dependencies
        run: uv sync --locked
      - uses: pre-commit/action@v3.0.1
      # The host installs from requirements.txt, CI from uv.lock: a file that drifted from the lock
      # deploys versions nothing here tested, or ones that do not install at all -- Django 6.1 next to
      # django-ninja 1.6, which needs Django below 6.1, broke the deploy that way. The uv-export hook
      # rewrites and stages the file, which pre-commit does not count as a change, so look here.
      - name: requirements.txt matches uv.lock
        run: git diff --exit-code HEAD -- requirements.txt

  commitizen:
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install commitizen
        run: pip install commitizen==4.13.10
      - name: Check commit messages
        run: cz check --rev-range origin/main..HEAD

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.13"
      - name: Export dependencies
        run: uv export --locked --no-hashes --no-annotate --no-default-groups --no-emit-project -o requirements.txt
      - name: Run pip-audit
        run: uvx pip-audit -r requirements.txt

  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: cycling_site_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost/cycling_site_test
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.13"
      - name: Install dependencies
        run: uv sync --locked
      - name: Run tests
        run: uv run pytest
