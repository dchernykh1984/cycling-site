name: Security Audit

on:
  schedule:
    - cron: "0 9 * * 6" # every Saturday at 09:00 UTC

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.13"
      - name: Export dependencies
        run: uv export --locked --no-hashes --no-annotate --no-default-groups --no-emit-project -o requirements.txt
      - name: Run pip-audit
        run: uvx pip-audit -r requirements.txt
      # The agents' packages run beside production secrets: their known vulnerabilities count too
      - name: Run pip-audit on the agents' packages
        run: |
          uv export --locked --no-hashes --no-annotate --only-group agents --no-emit-project -o agents-audit.txt
          uvx pip-audit -r agents-audit.txt
