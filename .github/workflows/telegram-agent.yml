name: telegram-agent

on:
  schedule:
    # 13:17 UTC daily -- after the events agent (11:17, Mondays and Fridays) and the Instagram agent
    # (12:17), so this one sees everything they just proposed. Chat announcements are short notice,
    # so this agent keeps its nightly cadence. The hour leaves 11 hours before the model's next peak
    # window (01:00-04:00 UTC, 2x pricing) -- the margin GitHub's cron drift needs -- and sits after
    # the other peak (06:00-10:00 UTC). Off the round minute to dodge cron congestion.
    - cron: "17 13 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Log the events without posting them"
        type: boolean
        default: false
      max_events:
        description: "Max events to propose per run"
        type: string
        default: "10"
      max_per_channel:
        description: "Max events one channel may contribute"
        type: string
        default: "5"
      recent_hours:
        description: "How far back to read, in hours (25 = a nightly day plus overlap)"
        type: string
        default: "25"
      max_posts:
        description: "Safety net: max messages read per channel"
        type: string
        default: "1000"

concurrency:
  group: telegram-agent
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # One job for every channel, deliberately -- the opposite of the Instagram agent's matrix. All
  # reads go through one logged-in session, and a session hopping addresses inside one night is
  # what gets a session revoked. One process, one connection, channels in sequence; the channel
  # list lives in telegram_channels.yaml and the agent reads it itself.
  read:
    # The secrets are the production environment's, which only main may use (Settings -> Environments):
    # a workflow pushed on any other branch gets none of them.
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Fail a run started by hand, or started again, by anyone other than the owner before any secret is
      # used: a re-run keeps the first run's actor, so the one who started it again is the triggering actor.
      - name: Restrict manual runs to the repository owner
        if: >-
          ${{ github.triggering_actor != github.repository_owner &&
          (github.event_name == 'workflow_dispatch' || github.run_attempt != '1') }}
        run: |
          echo "::error::Only ${{ github.repository_owner }} may run this workflow by hand (started by: ${{ github.triggering_actor }})."
          exit 1
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install pyyaml telethon
      - name: Read the channels
        env:
          SITE_BASE_URL: ${{ secrets.SITE_BASE_URL || 'https://universalbicycle.team' }}
          # The day a run counts from, in the site's own zone (its TIME_ZONE), not the runner's UTC.
          SITE_TIME_ZONE: ${{ vars.SITE_TIME_ZONE || 'Asia/Almaty' }}
          AGENT_API_TOKEN: ${{ secrets.AGENT_API_TOKEN }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
          TELEGRAM_MAX_EVENTS: ${{ github.event.inputs.max_events || '10' }}
          TELEGRAM_MAX_PER_CHANNEL: ${{ github.event.inputs.max_per_channel || '5' }}
          TELEGRAM_RECENT_HOURS: ${{ github.event.inputs.recent_hours || '25' }}
          TELEGRAM_MAX_POSTS: ${{ github.event.inputs.max_posts || '1000' }}
          TELEGRAM_DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: python -m telegram_agent.run
