name: E2E Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Desktop browsers - three rendering engines
          - browser: chromium
            device: ""
          - browser: firefox
            device: ""
          - browser: webkit
            device: ""
          # Mobile - Chromium (Android) and WebKit (iOS)
          - browser: chromium
            device: "Pixel 7"
          - browser: webkit
            device: "iPhone 15"

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost/cycling_site_test

    steps:
      - uses: actions/checkout@v6

      - name: Set up PostgreSQL
        run: |
          for attempt in 1 2 3; do
            sudo systemctl start postgresql && break
            echo "Attempt $attempt failed, retrying in 5s..."
            sleep 5
          done
          sudo -u postgres psql -c "ALTER USER postgres WITH PASSWORD 'postgres';"
          sudo -u postgres createdb cycling_site_test
          timeout 30 bash -c 'until pg_isready -h localhost -U postgres; do sleep 1; done'

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install Poetry
        run: pip install poetry

      - name: Configure Poetry
        run: poetry config virtualenvs.in-project true

      - name: Cache Poetry virtualenv
        uses: actions/cache@v5
        with:
          path: .venv
          key: venv-e2e-${{ runner.os }}-${{ hashFiles('poetry.lock') }}

      - name: Install dependencies
        run: poetry install --no-root

      - name: Install Playwright browser
        run: poetry run playwright install --with-deps ${{ matrix.browser }}

      - name: Run E2E tests (desktop)
        if: matrix.device == ''
        run: >
          poetry run pytest tests/e2e/
          --browser ${{ matrix.browser }}
          --tracing=retain-on-failure
          --no-cov
          -v
          --tb=short

      - name: Run E2E tests (mobile device)
        if: matrix.device != ''
        run: >
          poetry run pytest tests/e2e/
          --browser ${{ matrix.browser }}
          --device "${{ matrix.device }}"
          --tracing=retain-on-failure
          --no-cov
          -v
          --tb=short

      - name: Upload Playwright trace on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces-${{ matrix.browser }}-${{ matrix.device || 'desktop' }}
          path: test-results/
          retention-days: 7
