name: E2E Tests

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Desktop browsers - three rendering engines
          - browser: chromium
            device: ""
          - browser: firefox
            device: ""
          - browser: webkit
            device: ""
          # Mobile - Chromium (Android) and WebKit (iOS)
          - browser: chromium
            device: "Pixel 7"
          - browser: webkit
            device: "iPhone 15"

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost/cycling_site_test

    steps:
      - uses: actions/checkout@v6

      - name: Set up PostgreSQL
        run: |
          for attempt in 1 2 3; do
            sudo systemctl start postgresql && break
            echo "Attempt $attempt failed, retrying in 5s..."
            sleep 5
          done
          sudo -u postgres psql -c "ALTER USER postgres WITH PASSWORD 'postgres';"
          sudo -u postgres psql -c "ALTER SYSTEM SET max_connections = 200;"
          sudo systemctl restart postgresql
          timeout 30 bash -c 'until pg_isready -h localhost -U postgres; do sleep 1; done'
          sudo -u postgres createdb cycling_site_test

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --locked

      - name: Install Playwright browser
        run: uv run playwright install --with-deps ${{ matrix.browser }}

      - name: Run E2E tests (desktop)
        if: matrix.device == ''
        run: >
          uv run pytest tests/e2e/
          --browser ${{ matrix.browser }}
          --tracing=retain-on-failure
          --no-cov
          -v
          --tb=short

      - name: Run E2E tests (mobile device)
        if: matrix.device != ''
        run: >
          uv run pytest tests/e2e/
          --browser ${{ matrix.browser }}
          --device "${{ matrix.device }}"
          --tracing=retain-on-failure
          --no-cov
          -v
          --tb=short

      - name: Upload Playwright trace on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces-${{ matrix.browser }}-${{ matrix.device || 'desktop' }}
          path: test-results/
          retention-days: 7
