name: Dropbox Integration

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dropbox-integration:
    # The storage credentials are secrets of the production environment, which only main may use
    # (Settings -> Environments): a pull request is checked once it is merged, and no branch's
    # workflow, a fork's or this repository's, receives them. No pull_request_target.
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Fail a run started by hand, or started again, by anyone other than the owner before any secret is
      # used: a re-run keeps the first run's actor, so the one who started it again is the triggering actor.
      - name: Restrict manual runs to the repository owner
        if: >-
          ${{ github.triggering_actor != github.repository_owner &&
          (github.event_name == 'workflow_dispatch' || github.run_attempt != '1') }}
        run: |
          echo "::error::Only ${{ github.repository_owner }} may run this workflow by hand (started by: ${{ github.triggering_actor }})."
          exit 1
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.13"
      - name: Install dependencies
        run: uv sync --locked
      - name: Read index and decode one Dropbox thumbnail
        env:
          RUN_DROPBOX_INTEGRATION: "1"
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
          DROPBOX_TEST_FOLDER_URL: ${{ secrets.DROPBOX_TEST_FOLDER_URL }}
        run: uv run pytest tests/integration/test_dropbox_photos.py -n 0 --no-cov -q --tb=short
