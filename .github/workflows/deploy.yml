name: Deploy to CodeRed

on:
  # CodeRed is now only a manual fallback for the migration to Render: auto-deploy on push is
  # disabled. Trigger by hand from the GitHub UI ("Run workflow") if the fallback ever needs an
  # update. Remove this workflow entirely once CodeRed is decommissioned.
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install CodeRed CLI
        run: pip install cr

      - name: Deploy
        run: cr deploy cycling
        env:
          CR_TOKEN: ${{ secrets.CR_TOKEN }}

      - name: Health check
        env:
          CR_TOKEN: ${{ secrets.CR_TOKEN }}
        run: |
          SITE_URL=$(cr list | awk 'NR>1 && $1=="cycling" {print $3}')
          echo "Checking $SITE_URL"
          for i in $(seq 1 12); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$SITE_URL")
            echo "Attempt $i: HTTP $STATUS"
            if [ "$STATUS" = "200" ]; then
              echo "Site is up"
              exit 0
            fi
            sleep 10
          done
          echo "Health check failed: site did not return 200 after 2 minutes"
          exit 1
