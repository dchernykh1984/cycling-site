name: Deploy to CodeRed

on:
  workflow_run:
    workflows: ["CI"]
    branches: [main]
    types: [completed]
  workflow_dispatch: # allow manual runs from the GitHub UI

jobs:
  deploy:
    # Only deploy if the CI workflow on main finished successfully.
    # workflow_dispatch runs have no triggering workflow, so allow those too.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      # Pin to the exact commit CI validated; for manual runs fall back to the dispatch SHA.
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install CodeRed CLI
        run: pip install cr

      - name: Deploy
        run: cr deploy cycling
        env:
          CR_TOKEN: ${{ secrets.CR_TOKEN }}

      - name: Health check
        env:
          CR_TOKEN: ${{ secrets.CR_TOKEN }}
        run: |
          SITE_URL=$(cr list | awk 'NR>1 && $1=="cycling" {print $3}')
          echo "Checking $SITE_URL"
          for i in $(seq 1 12); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$SITE_URL")
            echo "Attempt $i: HTTP $STATUS"
            if [ "$STATUS" = "200" ]; then
              echo "Site is up"
              exit 0
            fi
            sleep 10
          done
          echo "Health check failed: site did not return 200 after 2 minutes"
          exit 1
