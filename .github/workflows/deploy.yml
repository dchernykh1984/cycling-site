name: nightly-deploy

# Merged changes go live at night, when few people read the site (issue #153). The web service keeps
# its media on a persistent disk, and with a disk Render stops the running instance before it starts
# the new one, so every deploy takes the site down for up to a minute. Render's auto-deploy is off;
# this workflow deploys instead.
#
# scripts/deploy_if_behind.py deploys main only when the site names another commit at
# /api/v1/version/ and every check main's push started is green (CI, the Dropbox check, any later
# one): it waits for a check still running, and deploys nothing while one is red. It then waits until
# the site names main's commit, so a deploy that fails turns the run red. "Run workflow" deploys at once, for an urgent change: on the
# maintainer's word only, since it takes the site down.
on:
  schedule:
    # A run deploys only when it starts inside DEPLOY_WINDOW_UTC below, 21:00-01:00 UTC (02:00-06:00 in
    # Almaty). GitHub starts a cron when it has capacity: on the first three nights it started the one
    # 21:07 run 4 to 5 hours late, past the window, and nothing was deployed. So a run is asked for every
    # hour from 17:07 to 00:07 UTC, off the round minute to dodge congestion. Started on time or up to
    # about 7 hours late, one of them starts inside the window and deploys; the rest start outside it,
    # or find the site already on main, and do nothing.
    - cron: "7 0,17-23 * * *"
  workflow_dispatch:

concurrency:
  group: nightly-deploy
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

jobs:
  deploy:
    # The secrets are the production environment's, which only main may use (Settings -> Environments):
    # a workflow pushed on any other branch gets none of them.
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 60 # up to 30 minutes for main's checks, then up to 20 for the site to name the commit
    steps:
      # Fail a run started by hand, or started again, by anyone other than the owner before any secret is
      # used: a re-run keeps the first run's actor, so the one who started it again is the triggering actor.
      - name: Restrict manual runs to the repository owner
        if: >-
          ${{ github.triggering_actor != github.repository_owner &&
          (github.event_name == 'workflow_dispatch' || github.run_attempt != '1') }}
        run: |
          echo "::error::Only ${{ github.repository_owner }} may run this workflow by hand (started by: ${{ github.triggering_actor }})."
          exit 1
      - uses: actions/checkout@v7
      - name: Deploy main if the site runs another commit
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SITE_BASE_URL: ${{ secrets.SITE_BASE_URL || 'https://universalbicycle.team' }}
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          DEPLOY_WINDOW_UTC: ${{ github.event_name == 'schedule' && '21:00-01:00' || '' }}
        run: python3 scripts/deploy_if_behind.py
