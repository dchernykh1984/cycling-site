name: events-agent

# Discovers cycling events from the curated sources and proposes them to the site as pending
# competitions for a human moderator. Scheduled runs only fire from the default branch (main);
# use "Run workflow" (with dry_run) to test from a branch. Manual runs are restricted to the
# repository owner so nobody else can spend the LLM/API budget.
on:
  schedule:
    # Mondays and Fridays, 11:17 UTC (16:17 Almaty). Websites announce their races weeks ahead, so
    # reading them twice a week costs nothing in lead time -- and this is the expensive agent: it
    # reads 27 sources and runs 20-40 minutes, against 1-4 minutes for the Telegram and Instagram
    # ones. Friday catches what appeared during the week, Monday what appeared over the weekend.
    #
    # 11:17 UTC leaves 13 hours before the model's next peak window (01:00-04:00 UTC, 2x pricing).
    # GitHub starts a cron when it has capacity -- our own runs have drifted five hours on a bad
    # day -- so the slot is chosen for that drift, not for the nominal minute. It also sits after
    # the 06:00-10:00 peak and before the US-afternoon rush that makes the drift worst.
    - cron: "17 11 * * 1,5"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Log candidates without posting them"
        type: boolean
        default: false
      max_events:
        description: "Max events to propose this run"
        type: string
        default: "25"
      max_per_source:
        description: "Max events one source may contribute (0 = no limit)"
        type: string
        default: "5"

concurrency:
  group: events-agent
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60 # sources may retry with a 10s backoff, and each placed event now downloads a
    # GPS track for its start coordinate; a 10-event run took 25 minutes, so the 25-event default
    # (and a larger manual run) needs the headroom
    steps:
      # Fail a manual run started by anyone other than the owner before any secret is used.
      - name: Restrict manual runs to the repository owner
        if: ${{ github.event_name == 'workflow_dispatch' && github.actor != github.repository_owner }}
        run: |
          echo "::error::Only ${{ github.repository_owner }} may run this workflow manually (actor: ${{ github.actor }})."
          exit 1
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install beautifulsoup4 pyyaml
      - name: Run events agent
        env:
          SITE_BASE_URL: ${{ secrets.SITE_BASE_URL || 'https://universalbicycle.team' }}
          AGENT_API_TOKEN: ${{ secrets.AGENT_API_TOKEN }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL || 'deepseek-chat' }}
          MAX_EVENTS_PER_RUN: ${{ github.event.inputs.max_events || '25' }}
          # No single source may take more than this many of the run's slots, so a calendar with an
          # endless supply of races cannot crowd out the organizers whose events the site is for.
          MAX_EVENTS_PER_SOURCE: ${{ github.event.inputs.max_per_source || '5' }}
          AGENT_DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: python -m agent.run
