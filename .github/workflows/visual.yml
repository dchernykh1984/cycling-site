name: Light and dark unchanged

# Screenshots of the branch against screenshots of the branch it merges into, taken one after the
# other on the same runner (tests/visual/run.py). Any pixel of the light or dark theme that moved
# fails the job; the maintainer lets a deliberate change through with the visual-change-approved
# label, which is why adding or removing a label runs the job again.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  visual:
    runs-on: ubuntu-latest
    env:
      VISUAL_DB_URL: postgres://postgres:postgres@localhost/postgres
      APPROVED: ${{ contains(github.event.pull_request.labels.*.name, 'visual-change-approved') }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up PostgreSQL
        run: |
          for attempt in 1 2 3; do
            sudo systemctl start postgresql && break
            echo "Attempt $attempt failed, retrying in 5s..."
            sleep 5
          done
          sudo -u postgres psql -c "ALTER USER postgres WITH PASSWORD 'postgres';"
          timeout 30 bash -c 'until pg_isready -h localhost -U postgres; do sleep 1; done'

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --locked

      - name: Install Playwright browsers
        run: uv run playwright install --with-deps chromium webkit

      - name: Compare with ${{ github.base_ref }}
        run: |
          if uv run python tests/visual/run.py --base-ref "${{ github.event.pull_request.base.sha }}" --out visual-out; then
            exit 0
          elif [ "$APPROVED" = "true" ]; then
            echo "::warning::Light or dark changed; let through by the visual-change-approved label."
          else
            exit 1
          fi

      - name: Upload the differences
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: visual-diff
          path: visual-out/diff
          if-no-files-found: ignore
