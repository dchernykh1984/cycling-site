{% comment %}Line icons for the gallery pages (24x24, stroke = currentColor), decorative only.

<svg class="gallery-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">

{% elif name == "arrow-circle" %}<circle cx="12" cy="12" r="9.5"/><path d="M7.5 12h9M12.5 8l4 4-4 4"/>

{% elif name == "edit" %}<path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13.5 6.5l4 4"/>
