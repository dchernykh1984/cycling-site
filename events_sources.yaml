# Sources the events agent scans, grouped by type so each is handled deterministically.
# This file lives in the repo root and is re-read on every run -- edit it freely.
#
# Each entry is either a bare string, or a mapping for extra control:
#   - https://example.kz/                      # simple form
#   - url: https://example.kz/calendar/        # with options:
#     hint: "races are listed under /calendar"  #   free-text nudge passed to the model
#     enabled: false                            #   set false to pause this source
#
# Types (choose the section by what the URL is):
#   aggregators       calendars/platforms listing many organizers' races. The agent extracts each
#                     race's own page from the calendar and proposes it; source_url must be the
#                     organizer's page, never the aggregator. More page links are surfaced here.
#   organizers        a single organizer's own website -- scanned for their upcoming races.
#   telegram_public   public Telegram channels, read via the t.me/s/<channel> web preview (no login).
#                     Give the channel URL or an @handle.
#   telegram_private  private channels/chats (t.me/+invite, t.me/c/<id>). They cannot be read without
#                     an account, so they are kept here for reference and skipped at runtime.

aggregators:
  - url: https://battistrada.com/en/cycling-calendar/china/
    hint: "International cycling calendar; each row links to a race -- use that race's own page as source_url."
  - url: https://bike-events.ru/
    hint: "Multi-organizer cycling calendar (RU); use each race's own organizer page as source_url."

organizers:
  # Kazakhstan / Kyrgyzstan (highest priority per agent/guidance.md)
  - https://changan-race.kz/ru/
  - https://athletex.kz/
  - https://www.granfondo.com.kz/ru/
  - https://cycling.kz/ru/
  - https://velosport.kg/
  - https://almaty-marathon.kz/
  - https://velorace.lovable.app/
  - https://velomania.kz/
  - https://sportevents.kz/
  # Russia (lower priority)
  - https://velogearance.ru/
  - https://redbikecup.ru/rbc/2026
  - https://bitza-sport.ru/
  - https://www.sk-romashkovo.ru/
  - https://skisport.ru/
  - https://forum.velomania.ru/
  - https://www.granfondo.ru/
  - https://sportmarafonfest.ru/

telegram_public:
  # Readable public broadcast channels (they expose a t.me/s/<channel> web feed).
  - https://t.me/roadcyclingkz
  - https://t.me/mystartkz/903
  - "@athletex"
  - https://t.me/not_olympic
  # Disabled: public but NOT readable by the agent -- these are groups/chats (members, not
  # subscribers) or a personal account, so they have no t.me/s/ web feed (verified 2026-07-14 via
  # telegram.me while t.me was down). Re-enable an entry if you have its broadcast channel's @handle.
  - url: "@almatyriders"
    enabled: false
    hint: "Telegram group (~351 members), no t.me/s/ feed -- not a broadcast channel."
  - url: "@roadbikealmaty"
    enabled: false
    hint: "700c Almaty club chat / group (~533 members), no t.me/s/ feed."
  - url: "@almatyskiing"
    enabled: false
    hint: "Telegram group (~131 members), no t.me/s/ feed."
  - url: https://t.me/cyclingtourismalmaty
    enabled: false
    hint: "Telegram group (~60 members), no t.me/s/ feed."
  - url: https://t.me/talgar2026
    enabled: false
    hint: "Telegram group (~29 members), no t.me/s/ feed -- not a broadcast channel."
  - url: https://t.me/kztime
    enabled: false
    hint: "Personal account (@kztime), not a channel -- nothing for the agent to read."
  # "RideBikes Казахстан" was listed without a handle -- add its @handle here to enable it.

