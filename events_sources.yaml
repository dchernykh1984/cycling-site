# Sources the events agent scans, grouped by type so each is handled deterministically.
# This file lives in the repo root and is re-read on every run -- edit it freely.
#
# Each entry is either a bare string, or a mapping for extra control:
#   - https://example.kz/                      # simple form
#   - url: https://example.kz/calendar/        # with options:
#     hint: "races are listed under /calendar"  #   free-text nudge passed to the model
#     enabled: false                            #   set false to pause this source
#
# Types (choose the section by what the URL is):
#   aggregators       calendars/platforms listing many organizers' races. The agent extracts each
#                     race's own page from the calendar and proposes it; source_url must be the
#                     organizer's page, never the aggregator. More page links are surfaced here.
#   organizers        a single organizer's own website -- scanned for their upcoming races.
#   telegram_public   public Telegram channels, read via the t.me/s/<channel> web preview (no login).
#                     Give the channel URL or an @handle.
#   telegram_private  private channels/chats (t.me/+invite, t.me/c/<id>). They cannot be read without
#                     an account, so they are kept here for reference and skipped at runtime.

aggregators:
  - url: https://bike-events.ru/index.php?season=S2026
    hint: "Multi-organizer cycling calendar (RU), races grouped by month; bump season=S<year> yearly; source_url must be each race's own organizer page."
  - url: https://begaem.com/blizhayshie-startyi-v-rossii
    hint: "Running calendar for Russia, grouped by month. Each row is date, place, distances and a
      link to the event's own site -- use that link as source_url. The place column varies: a bare
      city, a region and a city, or a region plus a district and a venue. Read it accordingly and
      never pass a district as the region. These are running events, which ARE in scope for this site -- extract every one, just as you would a cycling calendar."
  - url: https://begaem.com/blizhayshie-startyi-za-rubezhom
    hint: "Same calendar for the rest of the world; the row reads 'Country, City' and mixes Russian
      and English spellings on one page. Every one of these foreign running events is in scope --
      extract them all, a marathon in Iceland or Japan counts exactly like a race at home. Give the
      country, region and city in all three locales so the same town is not proposed twice."

organizers:
  # Kazakhstan / Kyrgyzstan (highest priority per agent/guidance.md)
  - https://changan-race.kz/ru/
  - https://athletex.kz/
  - https://www.granfondo.com.kz/ru/
  - https://cycling.kz/ru/
  - https://velosport.kg/
  - https://almaty-marathon.kz/
  - https://velorace.lovable.app/
  - https://velomania.kz/
  - https://sportevents.kz/
  - url: https://www.themountainraces.cc/
    hint: "The Mountain Races -- Silk Road (Kyrgyzstan), Atlas (Morocco), Hellenic (Greece) and any
      race they add later. The home page lists them all with a 'Next edition:' date, and each links
      to its own page -- use that link as source_url. Skip an edition whose date reads 'TBC'."
  - url: https://www.randonneurs.kz/
    hint: "Brevet calendar of the Randonneurs Kazakhstan / Saryarqa clubs (Almaty, Astana, Karaganda,
      Shchuchinsk). Every start has its own /event/<slug> page naming the start venue -- use it as
      source_url."
  # Russia (lower priority)
  - https://velogearance.ru/
  - https://redbikecup.ru/rbc/2026
  - https://bitza-sport.ru/
  - https://www.sk-romashkovo.ru/
  - https://skisport.ru/
  - https://forum.velomania.ru/
  - https://www.granfondo.ru/
  - https://sportmarafonfest.ru/

