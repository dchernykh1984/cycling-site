[project]
name = "cycling-site"
version = "0.1.0"
description = "Cycling Wagtail website"
authors = [{ name = "Denis Chernykh", email = "education03@mail.ru" }]
requires-python = ">=3.13,<4"
dependencies = [
    "Django>=5.2,<7.0",
    "wagtail>=7.4,<8.0",
    "gunicorn>=23,<27",
    "whitenoise[brotli]>=6.9,<7",
    "psycopg2-binary>=2.9.10,<3",
    "dj-database-url>=3.1.2,<4",
    "django-environ>=0.13.0,<0.15",
    "django-allauth[socialaccount]>=65.0,<66",
    "wagtail-localize>=1.13,<2.0",
    "django-modeltranslation>=0.20,<0.21",
    "django-treebeard>=4.8,<6.0",
    "django-ninja>=1.6.2,<2",
    "pyyaml>=6,<7",
]

[dependency-groups]
dev = [
    "ruff>=0.15.12,<0.16",
    "pre-commit>=4.6.0,<5",
    "mypy>=2.1.0,<3",
    "commitizen>=4.13.10,<5",
    "pytest>=9.0.3,<10",
    "pytest-xdist>=3.8.0,<4",
    "pytest-asyncio>=1.3.0,<2",
    "pytest-cov>=7.1.0,<8",
    "django-debug-toolbar>=6.3.0,<8",
    "pytest-django>=4.12.0,<5",
    "ipython>=9.13.0,<10",
    "django-stubs>=6.0.7,<7.0",
    "pytest-playwright>=0.7,<1.0",
]

[tool.uv]
package = false
default-groups = "all"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "C90", # McCabe cyclomatic complexity
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "S",   # flake8-bandit
    "PTH", # flake8-use-pathlib
    "RUF", # Ruff-specific rules
    "DJ",  # flake8-django
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**/*.py" = ["S101", "S105", "S106", "S603", "S607"]
"tests/e2e/**/*.py" = ["S101", "S105", "S106", "S603", "S607"]
"**/tests.py" = ["S101", "S105", "S106"]
# The agent only ever opens http(s) URLs from the source list / site API / LLM endpoint.
"agent/fetch.py" = ["S310"]
"instagram_agent/fetch.py" = ["S310"]
"agent/llm.py" = ["S310"]
"agent/site_api.py" = ["S310"]
"**/migrations/*.py" = ["N806", "RUF001", "RUF012", "E501"]
"cycling_site/settings/*.py" = ["F403", "F405", "S105"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.mypy]
ignore_missing_imports = true
plugins = ["mypy_django_plugin.main"]
exclude = ["migrations/"]

[tool.django-stubs]
django_settings_module = "cycling_site.settings.dev"

[tool.coverage.run]
parallel = true
omit = [
    "home/migrations/*",
    "manage.py",
    "cycling_site/wsgi.py",
    "cycling_site/settings/prod.py",
    "tests/e2e/*",
    # Standalone scheduled tool (talks to the site over HTTP, not the ORM). Its pure logic has its
    # own tests under agent/tests/; the network/LLM adapters are not part of the site coverage gate.
    "agent/*",
    # The Instagram agent is the same kind of standalone tool, with its own tests under
    # instagram_agent/tests/.
    "instagram_agent/*",
]

[tool.pytest.ini_options]
testpaths = ["."]
pythonpath = ["."]
asyncio_mode = "auto"
DJANGO_SETTINGS_MODULE = "cycling_site.settings.test"
python_files = ["test_*.py", "*_test.py", "tests.py"]
addopts = "-n auto --cov=. --cov-fail-under=90 --cov-report=term-missing --ignore=tests/e2e"
markers = [
    "debug: mark test for local debugging and run it in isolation",
    "e2e: end-to-end Playwright tests (run separately via tests/e2e/)",
]
