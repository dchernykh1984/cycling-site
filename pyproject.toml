[tool.poetry]
name = "cycling-site"
version = "0.1.0"
description = "Cycling Wagtail website"
authors = ["Denis Chernykh <education03@mail.ru>"]
package-mode = false

[tool.poetry.dependencies]
python = "^3.13"
Django = ">=5.2,<7.0"
wagtail = ">=7.4,<8.0"
gunicorn = ">=23,<27"
whitenoise = {extras = ["brotli"], version = "^6.9"}
psycopg2-binary = "^2.9.10"
dj-database-url = "^3.1.2"
django-environ = "^0.13.0"
django-allauth = {version = "^65.0", extras = ["socialaccount"]}
wagtail-localize = ">=1.13,<2.0"
django-modeltranslation = ">=0.20,<0.21"
django-treebeard = ">=4.8,<6.0"

[tool.poetry.group.dev.dependencies]
ruff = "^0.15.12"
pre-commit = "^4.6.0"
mypy = "^2.1.0"
commitizen = "^4.13.10"
pytest = "^9.0.3"
pytest-xdist = "^3.8.0"
pytest-asyncio = "^1.3.0"
pytest-cov = "^7.1.0"
django-debug-toolbar = "^6.3.0"
pytest-django = "^4.12.0"
ipython = "^9.13.0"
django-stubs = ">=5.1,<7.0"
pytest-playwright = ">=0.7,<1.0"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "C90", # McCabe cyclomatic complexity
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "S",   # flake8-bandit
    "PTH", # flake8-use-pathlib
    "RUF", # Ruff-specific rules
    "DJ",  # flake8-django
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**/*.py" = ["S101", "S105", "S106", "S603", "S607"]
"tests/e2e/**/*.py" = ["S101", "S105", "S106", "S603", "S607"]
"**/tests.py" = ["S101", "S105", "S106"]
"**/migrations/*.py" = ["N806", "RUF001", "RUF012", "E501"]
"cycling_site/settings/*.py" = ["F403", "F405", "S105"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.mypy]
ignore_missing_imports = true
plugins = ["mypy_django_plugin.main"]
exclude = ["migrations/"]

[tool.django-stubs]
django_settings_module = "cycling_site.settings.dev"

[tool.coverage.run]
parallel = true
omit = [
    "home/migrations/*",
    "manage.py",
    "cycling_site/wsgi.py",
    "cycling_site/settings/prod.py",
    "tests/e2e/*",
]

[tool.pytest.ini_options]
testpaths = ["."]
pythonpath = ["."]
asyncio_mode = "auto"
DJANGO_SETTINGS_MODULE = "cycling_site.settings.test"
python_files = ["test_*.py", "*_test.py", "tests.py"]
addopts = "-n auto --cov=. --cov-fail-under=90 --cov-report=term-missing --ignore=tests/e2e"
markers = [
    "debug: mark test for local debugging and run it in isolation",
    "e2e: end-to-end Playwright tests (run separately via tests/e2e/)",
]
