{% if item.kind == "field" %}<p class="protocol-field{% if item.key %} protocol-field--{{ item.key }}{% endif %} mb-1">{% if item.label %}<span class="protocol-field-label">{{ item.label }}:</span> {% endif %}<span class="protocol-field-value">{{ item.value }}</span></p>{% elif item.kind == "text" %}<p class="protocol-text mb-1">{{ item.text }}</p>{% else %}<div class="protocol-html">{{ item.html|safe }}</div>{% endif %}
