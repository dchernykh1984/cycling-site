{% extends "allauth/layouts/base.html" %}
{% block extra_css %}
{{ block.super }}
<style>
main.container{max-width:720px!important}
main.container input[type="text"],main.container input[type="email"],main.container input[type="password"],main.container input[type="tel"],main.container select,main.container textarea{display:block;width:100%;padding:.375rem .75rem;font-size:1rem;font-weight:400;line-height:1.5;color:var(--bs-body-color);background-color:var(--bs-body-bg);border:var(--bs-border-width) solid var(--bs-border-color);border-radius:var(--bs-border-radius);transition:border-color .15s ease-in-out,box-shadow .15s ease-in-out}
main.container input:focus,main.container select:focus,main.container textarea:focus{outline:0;border-color:#86b7fe;box-shadow:0 0 0 .25rem rgba(13,110,253,.25)}
main.container label{display:inline-block;margin-bottom:.5rem}
main.container ul.errorlist{color:var(--bs-danger);list-style:none;padding:0;margin:.25rem 0 0;font-size:.875em}
</style>
{% endblock %}
