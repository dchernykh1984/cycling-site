{% comment %}
Shared rich-text (Quill) editor used by every on-site content form: competitions, news,
knowledge and the home page. Include ONCE per page (in the extra_js block). For each editable
rich field, place inline in the form a box and its hidden field:

  <div class="quill-editor" data-target="id_body_ru" data-init="init-body-ru"></div>
  {{ form.body_ru }}   {# the hidden <input>/<textarea>; keep it next to the box #}

and emit the initial HTML as a json_script (before this include), e.g.:

  {{ form.body_ru.value|default:""|json_script:"init-body-ru" }}

On submit each editor's HTML is copied into its hidden field; the server sanitizes it. All
editors are initialised on load (including those in hidden Bootstrap tab-panes) and get a focus
call when their tab is shown so cursor positioning is correct. Quill is vendored locally (no
CDN) so the editor works offline.

Must be a {% templatetag openblock %} comment {% templatetag closeblock %} block, not a Django
"{#...#}" comment: the latter is single-line only, so a multi-line one would leak into the page.
{% endcomment %}
{% load static i18n %}
<link href="{% static 'calendar_app/vendor/quill/quill.snow.css' %}" rel="stylesheet">
<style>
.quill-editor{background:#fff}
/* Quill adds .ql-container to the .quill-editor element itself, so the editable area is the
   inner .ql-editor; size that (a `.quill-editor .ql-container` descendant rule never matches). */
.quill-editor .ql-editor{min-height:200px;font-size:1rem}
/* Quill Snow hardcodes English heading-picker labels; localize them by the UI language on
   <html lang>. en keeps the upstream English labels. Only the toolbar values are shipped
   ([2, 3, false] -> Normal / Heading 2 / Heading 3). */
html[lang="ru"] .ql-snow .ql-picker.ql-header .ql-picker-label::before,
html[lang="ru"] .ql-snow .ql-picker.ql-header .ql-picker-item::before{content:"Обычный"}
html[lang="ru"] .ql-snow .ql-picker.ql-header .ql-picker-label[data-value="2"]::before,
html[lang="ru"] .ql-snow .ql-picker.ql-header .ql-picker-item[data-value="2"]::before{content:"Заголовок 2"}
html[lang="ru"] .ql-snow .ql-picker.ql-header .ql-picker-label[data-value="3"]::before,
html[lang="ru"] .ql-snow .ql-picker.ql-header .ql-picker-item[data-value="3"]::before{content:"Заголовок 3"}
html[lang="kk"] .ql-snow .ql-picker.ql-header .ql-picker-label::before,
html[lang="kk"] .ql-snow .ql-picker.ql-header .ql-picker-item::before{content:"Қалыпты"}
html[lang="kk"] .ql-snow .ql-picker.ql-header .ql-picker-label[data-value="2"]::before,
html[lang="kk"] .ql-snow .ql-picker.ql-header .ql-picker-item[data-value="2"]::before{content:"Тақырып 2"}
html[lang="kk"] .ql-snow .ql-picker.ql-header .ql-picker-label[data-value="3"]::before,
html[lang="kk"] .ql-snow .ql-picker.ql-header .ql-picker-item[data-value="3"]::before{content:"Тақырып 3"}
</style>
{% trans "The text is too large. Use fewer or smaller inline images." as quill_too_large_msg %}
{{ quill_too_large_msg|json_script:"quill-too-large-msg" }}
<script src="{% static 'calendar_app/vendor/quill/quill.min.js' %}"></script>
<script src="{% static 'calendar_app/vendor/quill/blot-formatter.min.js' %}"></script>
<script>
(function () {
  if (typeof Quill === 'undefined') return;
  var TOOLBAR = [
    [{ 'header': [2, 3, 4, false] }],
    ['bold', 'italic', 'underline', 'strike'],
    [{ 'color': [] }, { 'background': [] }],
    [{ 'script': 'sub' }, { 'script': 'super' }],
    [{ 'list': 'ordered' }, { 'list': 'bullet' }],
    [{ 'indent': '-1' }, { 'indent': '+1' }],
    [{ 'align': [] }],
    ['blockquote', 'code-block', 'link', 'image'],
    ['clean']
  ];

  // Persist the geometry the image tool writes. Quill's default image blot keeps only
  // alt/width/height, so re-opening an edited article would drop the inline float/margin and
  // the data-align marker; widen the blot's attribute list so they round-trip through Quill.
  // The server re-checks every one against its own allowlist (cycling_site.sanitize) on save.
  var ImageBlot = Quill.import('formats/image');
  var IMAGE_ATTRS = ['alt', 'height', 'width', 'style', 'data-align'];
  ImageBlot.formats = function (domNode) {
    return IMAGE_ATTRS.reduce(function (formats, name) {
      if (domNode.hasAttribute(name)) formats[name] = domNode.getAttribute(name);
      return formats;
    }, {});
  };
  var baseImageFormat = ImageBlot.prototype.format;
  ImageBlot.prototype.format = function (name, value) {
    if (IMAGE_ATTRS.indexOf(name) > -1) {
      if (value) this.domNode.setAttribute(name, value);
      else this.domNode.removeAttribute(name);
    } else {
      baseImageFormat.call(this, name, value);
    }
  };
  Quill.register(ImageBlot, true);

  // Drag-to-resize + left/center/right alignment overlay for images (vendored, offline). With
  // its default options it writes width/height attributes and inline float/margin straight onto
  // the <img>, so the result renders on the public article page with no Quill and no extra CSS.
  var hasBlotFormatter = !!(window.QuillBlotFormatter && window.QuillBlotFormatter.default);
  if (hasBlotFormatter) {
    Quill.register('modules/blotFormatter', window.QuillBlotFormatter.default);
  }
  // Keep in sync with cycling_site.richtext.MAX_RICH_TEXT_LENGTH; reject before submit so an
  // oversized base64 image fails with a clear message, not a raw HTTP 400 on the request body.
  var MAX = 1000000;
  var msgEl = document.getElementById('quill-too-large-msg');
  var TOO_LARGE = msgEl ? JSON.parse(msgEl.textContent) : 'The text is too large.';

  function initBox(box) {
    if (box.dataset.quillReady) return;
    box.dataset.quillReady = '1';
    var hidden = document.getElementById(box.dataset.target);
    var initEl = box.dataset.init ? document.getElementById(box.dataset.init) : null;
    var modules = { toolbar: TOOLBAR };
    if (hasBlotFormatter) modules.blotFormatter = {};
    var quill = new Quill(box, { theme: 'snow', modules: modules });
    if (initEl) {
      var html = JSON.parse(initEl.textContent);
      if (html) quill.clipboard.dangerouslyPasteHTML(html);
    }
    if (hidden && hidden.form) {
      hidden.form.addEventListener('submit', function (ev) {
        var content = quill.root.innerHTML;
        if (content.length > MAX) {
          ev.preventDefault();
          window.alert(TOO_LARGE);
          return;
        }
        hidden.value = content;
      });
    }
  }

  document.querySelectorAll('.quill-editor').forEach(initBox);
  // Editors initialised inside a hidden Bootstrap tab-pane need a focus call when the pane is
  // shown, otherwise cursor positioning breaks (Quill measured layout while it was hidden).
  document.querySelectorAll('[data-bs-toggle="tab"]').forEach(function (btn) {
    btn.addEventListener('shown.bs.tab', function () {
      var pane = document.querySelector(btn.dataset.bsTarget);
      var ed = pane && pane.querySelector('.quill-editor .ql-editor');
      if (ed) ed.focus();
    });
  });
}());
</script>
