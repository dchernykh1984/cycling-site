# Instagram accounts the Instagram agent reads, alongside events_sources.yaml for the web agent.
# Re-read on every run -- edit it freely.
#
# Each entry is either a bare username, or a mapping for extra control:
#   - ubtalmaty                                  # simple form
#   - username: ubtalmaty                        # with options:
#     hint: "an Almaty club; rides start in the city"  #   free-text nudge passed to the model
#     city: "Almaty"                             #   where this club rides, when its posts leave it out
#     enabled: false                             #   set false to pause the account without losing it
#
# Only professional (Business/Creator) accounts can be read; a personal account returns nothing.
# What is worth adding here is a club or organizer that ANNOUNCES rides -- an account that only
# posts results and photo reports costs a request every night and yields nothing.

accounts:
  # Only clubs that announce their rides nowhere else. Everything with a website, a public Telegram
  # channel or any other readable source belongs to the events agent instead (events_sources.yaml):
  # reading a feed this way is a last resort, so it is used only where there is no alternative.

  - username: ubtalmaty
    hint: >-
      Universal Bicycle Team, an Almaty road club. Announces a recurring Saturday "Early Bird" coffee
      ride, usually starting from the Giant store at Abay 47, and alternates those announcements with
      photo reports from the last ride. It has no channel and no working site, so this is the only
      place its rides are published.
    city: Almaty

  - username: almaty_cycling_track
    hint: >-
      The Almaty velodrome. Announces track sessions and starts held there. It has no website and no
      links in its profile -- this account is the only place its schedule appears.
    city: Almaty

  - username: bike_buddies_kids
    hint: >-
      A children's balance-bike section in Almaty. Announces kids' starts and race days; most other
      posts are training and marketing. Registration is a WhatsApp number and a form, so there is no
      calendar anywhere else to read.
    city: Almaty
