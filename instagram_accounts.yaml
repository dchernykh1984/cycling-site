# Instagram accounts the Instagram agent reads, alongside events_sources.yaml for the web agent.
# Re-read on every run -- edit it freely.
#
# Each entry is either a bare username, or a mapping for extra control:
#   - ubtalmaty                                  # simple form
#   - username: ubtalmaty                        # with options:
#     hint: "an Almaty club; rides start in the city"  #   free-text nudge passed to the model
#     city: "Almaty"                             #   where this club rides, when its posts leave it out
#     enabled: false                             #   set false to pause the account without losing it
#
# Only professional (Business/Creator) accounts can be read; a personal account returns nothing.
# What is worth adding here is a club or organizer that ANNOUNCES rides -- an account that only
# posts results and photo reports costs a request every night and yields nothing.

accounts:
  # --- Almaty clubs and organizers ------------------------------------------------------------
  - username: ubtalmaty
    hint: >-
      Universal Bicycle Team, an Almaty road club. Announces a recurring Saturday "Early Bird" coffee
      ride, usually starting from the Giant store at Abay 47. Posts alternate between announcements
      of the next ride and photo reports from the last one.
    city: Almaty

  - username: roadbikealmaty
    hint: An Almaty road-cycling account. Quiet since spring 2025, kept in case it wakes up.
    city: Almaty

  - username: gorny_club_almaty
    city: Almaty

  - username: almatymountfest
    hint: An Almaty mountain-sport festival.
    city: Almaty

  - username: sportevents.ala
    hint: An Almaty sport-events organizer.
    city: Almaty

  - username: alatau.run
    hint: A running club in the Alatau area of Almaty.
    city: Almaty

  - username: orient_school_almaty
    hint: An Almaty orienteering school; its starts are open events rather than lessons.
    city: Almaty

  - username: almaty_cycling_track
    hint: The Almaty velodrome. Announces track sessions and starts held there.
    city: Almaty

  - username: qaarman_bike_park
    hint: A bike park; announces races and open days on its own trails.

  # --- Children's cycling ---------------------------------------------------------------------
  - username: bike_buddies_kids
    hint: >-
      A children's balance-bike section in Almaty. Announces kids' starts and race days; most other
      posts are training and marketing.
    city: Almaty

  - username: kidscycling_almaty
    hint: Children's cycling in Almaty.
    city: Almaty

  - username: kids_bike_academy
    hint: A children's cycling and motorsport academy near Almaty (Talgar).

  # --- Federations and series -----------------------------------------------------------------
  - username: kcfkz
    hint: >-
      The Kazakhstan National Cycling Federation. Mostly publishes RESULTS of championships that have
      already finished -- those are not events to propose. Take only posts announcing a start that
      has not happened yet.

  - username: almaty_cycling
    hint: Cycling recruitment and events run with the Almaty cycling federation.
    city: Almaty

  - username: ccnsportkazakhstan
    hint: A sport organizer in Kazakhstan.

  - username: ridebikes_kz
    hint: A Kazakh cycling account posting rides and starts.

  - username: redbikecup
    hint: >-
      The redBikeCup series (Russia). Its stages also reach the site through the events agent, so a
      post about a stage already listed is a repeat, not a new event.

  # --- Kyrgyzstan -----------------------------------------------------------------------------
  - username: velosportkg
    hint: Cycling in Kyrgyzstan.

  - username: cross_country_ski_karakol
    hint: Cross-country skiing in Karakol, Kyrgyzstan.
    city: Karakol

  # --- Paused ---------------------------------------------------------------------------------
  # A personal account, so its posts cannot be read at all, and nothing new since September 2024.
  - username: alatauxco
    enabled: false
