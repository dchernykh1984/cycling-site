repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: check-toml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: mixed-line-ending
        args: [--fix=lf]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.12
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: mypy
        name: mypy
        language: system
        entry: uv run mypy
        types_or: [python, pyi]
        require_serial: true

  - repo: https://github.com/commitizen-tools/commitizen
    rev: v4.13.10
    hooks:
      - id: commitizen
        stages: [commit-msg]

  - repo: local
    hooks:
      - id: no-non-ascii
        name: no non-ASCII characters
        language: pygrep
        entry: '[^\x00-\x7f]'
        types_or: [python, yaml, markdown, toml, shell, json]
        # agent/guidance.md and events_sources.yaml are free-text steering files for the maintainer;
        # they naturally hold Russian (the events' language), so they are exempt from ASCII-only.
        exclude: ^(uv\.lock|.*/migrations/.*|agent/guidance\.md|events_sources\.yaml)$

      - id: uv-export
        name: export requirements.txt from uv.lock
        language: system
        entry: bash -c 'uv export --no-hashes --no-annotate --no-default-groups --no-emit-project -o requirements.txt && git add requirements.txt'
        pass_filenames: false
        always_run: true
