# Spec Kit's own files (issue #337) are generated by `specify` and refreshed by `specify integration
# upgrade`, which keeps any file it finds edited instead of updating it -- so no hook may rewrite them,
# and their typographic punctuation is theirs. The constitution is ours and is checked like any file.
exclude: ^(\.specify/(?!memory/constitution\.md$)|\.(claude|agents)/skills/speckit-[^/]+/)

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: check-toml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: mixed-line-ending
        args: [--fix=lf]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.12
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: mypy
        name: mypy
        language: system
        entry: uv run mypy
        types_or: [python, pyi]
        require_serial: true

  - repo: https://github.com/commitizen-tools/commitizen
    rev: v4.13.10
    hooks:
      - id: commitizen
        stages: [commit-msg]

  - repo: local
    hooks:
      # Runs before the ASCII check below, so a skin's names in Russian and Kazakh reach it escaped.
      - id: escape-skin-manifests
        name: escape non-ASCII text in skin manifests
        language: system
        entry: python3 scripts/escape_skin_manifests.py
        files: ^skins/[^/]+/manifest\.json$

      - id: no-non-ascii
        name: no non-ASCII characters
        language: pygrep
        entry: '[^\x00-\x7f]'
        types_or: [python, yaml, markdown, toml, shell, json]
        # The agents' guidance files and their source/account lists, and the event assistant's
        # skills, are free-text steering files for the maintainer; they naturally hold Russian (the
        # events' language), so they are exempt from ASCII-only.
        exclude: ^(uv\.lock|.*/migrations/.*|agent/guidance\.md|events_sources\.yaml|instagram_agent/guidance\.md|instagram_accounts\.yaml|telegram_agent/guidance\.md|telegram_channels\.yaml|assistant/skills/.*\.md)$

      # A colour written into a site template paints every skin the same; it belongs in skins/.
      - id: no-hex-colours-in-templates
        name: no hex colours in templates outside skins/
        language: system
        entry: python3 scripts/check_template_colours.py
        files: (^|/)templates/.*\.html$|^scripts/template_colours_allowed\.txt$
        exclude: ^skins/
        pass_filenames: false

      - id: uv-export
        name: export requirements.txt from uv.lock
        language: system
        entry: bash -c 'uv export --no-hashes --no-annotate --no-default-groups --no-emit-project -o requirements.txt && git add requirements.txt'
        pass_filenames: false
        always_run: true
