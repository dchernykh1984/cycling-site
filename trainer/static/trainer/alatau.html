<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Alatau</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=Unbounded:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E9EDF1; --panel:#FBFCFD; --ink:#15202B; --muted:#56657A; --line:#D3DAE2; --soft:#EEF2F6;
  --apple:#C3323B; --apple-ink:#FFFFFF; --amber:#E5A23A; --poplar:#4C7C55; --glacier:#3D7BB6;
  --hud:rgba(11,17,24,.58); --hud-ink:#F3F6F9; --hud-dim:#A9B6C4;
  --display:'Unbounded','Golos Text',system-ui,sans-serif;
  --body:'Golos Text',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#0E151D; --panel:#141E29; --ink:#E7ECF1; --muted:#93A2B3; --line:#263646; --soft:#1B2734; color-scheme:dark; }
}
:root[data-theme="dark"]{ --bg:#0E151D; --panel:#141E29; --ink:#E7ECF1; --muted:#93A2B3; --line:#263646; --soft:#1B2734; color-scheme:dark; }
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
html,body{margin:0;height:100%;overflow:hidden;background:#0B1118}
body{font-family:var(--body);color:var(--ink);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
*,*::before,*::after{box-sizing:border-box}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.hidden{display:none!important}

/* ---------- menu ---------- */
#menu{position:fixed;inset:0;display:flex;pointer-events:none;z-index:20}
.sheet{pointer-events:auto;width:min(430px,100%);height:100%;overflow-y:auto;background:var(--panel);
  padding:calc(env(safe-area-inset-top,0px) + 26px) 22px calc(env(safe-area-inset-bottom,0px) + 24px);
  border-right:1px solid var(--line)}
.brand{display:flex;align-items:flex-end;gap:14px;margin-bottom:6px}
.brand svg{flex:none}
.brand h1{font-family:var(--display);font-weight:700;font-size:34px;letter-spacing:-.02em;margin:0;line-height:1}
.lead{color:var(--muted);margin:10px 0 22px;line-height:1.5;font-size:15px}
.sheet h2{font-family:var(--display);font-weight:500;font-size:15px;margin:24px 0 10px}
.cities{display:flex;gap:8px;flex-wrap:wrap}
.city{border:1px solid var(--line);background:transparent;border-radius:999px;padding:7px 14px;font-size:14px}
.city[aria-pressed="true"]{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.city[disabled]{opacity:.45;cursor:not-allowed}
.routes{display:grid;gap:10px}
.route{display:grid;grid-template-columns:1fr auto;gap:2px 12px;text-align:left;border:1px solid var(--line);background:var(--soft);
  border-radius:14px;padding:12px 14px}
.route[aria-pressed="true"]{border-color:var(--apple);box-shadow:inset 0 0 0 1px var(--apple)}
.route b{font-weight:600;font-size:15px}
.route .meta{color:var(--muted);font-size:13px;grid-column:1}
.route .desc{color:var(--muted);font-size:13px;grid-column:1/-1;line-height:1.45;margin-top:4px}
.route canvas{grid-row:1/3;grid-column:2;width:96px;height:38px}
.field{display:grid;grid-template-columns:1fr minmax(0,170px);align-items:center;gap:10px;margin:10px 0;font-size:14px}
.field label{color:var(--muted)}
.field select,.field input{width:100%;border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:8px 10px}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:10px 14px;font-weight:500;min-height:44px} /* a finger's tap on a phone */
.btn.primary{background:var(--apple);color:var(--apple-ink);border-color:var(--apple);font-family:var(--display);font-weight:500;font-size:17px;padding:14px 18px;width:100%;margin-top:22px}
.devlist{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:8px}
.dev{display:grid;grid-template-columns:1fr auto;gap:2px 10px;border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:14px}
.dev small{color:var(--muted);font-size:12.5px}
.dev .tags{display:flex;gap:6px;margin-top:4px}
.tag{font-size:12px;padding:2px 8px;border-radius:999px;background:var(--soft);border:1px solid var(--line)}
.tag.on{background:color-mix(in srgb,var(--poplar) 22%,transparent);border-color:var(--poplar)}
#charPrev{display:block;width:100%;height:190px;border-radius:16px;background:var(--soft)}
.chars{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:10px}
.char{display:flex;align-items:center;gap:8px;text-align:left;border:1px solid var(--line);background:transparent;border-radius:12px;padding:7px 8px;min-width:0}
.char[aria-pressed="true"]{border-color:var(--apple);box-shadow:inset 0 0 0 1px var(--apple)}
.char .sw{flex:none;width:22px;height:22px;border-radius:50%;border:1px solid var(--line)}
.char b{display:block;font-weight:600;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.char small{display:block;color:var(--muted);font-size:11.5px;white-space:nowrap}
.hint{color:var(--muted);font-size:13px;line-height:1.5;margin:8px 0 0}
.hint.warn{color:var(--apple)}
.attr{color:var(--muted);font-size:12px;margin-top:20px;line-height:1.5}
.attr a{color:inherit}
@media (max-width:760px){
  #menu{align-items:flex-end}
  .sheet{width:100%;height:auto;max-height:66%;border-right:0;border-top:1px solid var(--line);border-radius:22px 22px 0 0;padding-top:20px}
  .brand h1{font-size:28px}
}

/* ---------- страница 1: настройки ---------- */
#menu{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:stretch;pointer-events:auto;background:var(--bg);color:var(--ink)}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--panel);border-bottom:1px solid var(--line);
  padding:calc(env(safe-area-inset-top,0px) + 12px) max(18px,env(safe-area-inset-right,0px)) 12px max(18px,env(safe-area-inset-left,0px))}
.topbar .brand{margin:0;align-items:center;gap:12px}
.topbar .brand h1{font-size:26px}
#btnRecords{margin:0}
.setup{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:18px max(16px,env(safe-area-inset-right,0px)) 28px max(16px,env(safe-area-inset-left,0px))}
.setup-in{max-width:1120px;margin:0 auto}
.setup .lead{margin:0 0 16px;max-width:760px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-items:start}
.box{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px;min-width:0}
.box.wide{grid-column:1/-1}
.box h2{display:flex;align-items:center;gap:10px;margin:0 0 14px;font-size:17px}
.num{width:26px;height:26px;border-radius:50%;background:var(--ink);color:var(--panel);display:inline-grid;place-items:center;font-size:13px;font-weight:700;flex:none}
.box .routes{grid-template-columns:repeat(auto-fill,minmax(260px,1fr));margin-top:12px}
.box #modeSeg{margin-bottom:6px}
.box #charPrev{height:210px}
.cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 32px}
.cols > div{min-width:0}
.mp-online{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.mp-chip{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--soft);border-radius:999px;padding:6px 12px 6px 8px;font-size:13px}
.mp-chip i{width:10px;height:10px;border-radius:50%;flex:none}
.mp-chip small{color:var(--muted)}
.mp-groups{display:grid;gap:8px;margin:10px 0}
.mp-group{display:flex;align-items:center;justify-content:space-between;gap:12px;border:1px solid var(--line);background:var(--soft);border-radius:14px;padding:12px 14px}
.mp-group.on{border-color:var(--apple);box-shadow:inset 0 0 0 1px var(--apple)}
.mp-group b{display:block;font-size:14.5px}
.mp-group small{color:var(--muted);font-size:13px}
.mp-group .btn{flex:none}
.mp-group.linked{border-color:var(--amber);box-shadow:inset 0 0 0 1px var(--amber)}
.mp-group{flex-wrap:wrap}
.mp-acts{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;margin-left:auto}
.mp-create{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.mp-create select{border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:10px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.startbar{display:flex;align-items:center;gap:16px;background:var(--panel);border-top:1px solid var(--line);
  padding:12px max(18px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 12px) max(18px,env(safe-area-inset-left,0px))}
.startbar .sum{flex:1;min-width:0;font-size:14px;color:var(--muted);line-height:1.4}
.startbar .sum b{display:block;color:var(--ink);font-size:15px}
.startbar .btn.primary{width:auto;min-width:220px;margin:0}
@media (max-width:820px){
  .grid,.cols{grid-template-columns:1fr}
  .startbar .btn.primary{min-width:0;padding:14px 26px}
  .topbar .brand h1{font-size:22px}
}

/* ---------- hud (always over 3D, theme-independent) ---------- */
.hud{position:fixed;z-index:10;color:var(--hud-ink);font-family:var(--body);pointer-events:none}
.panel{background:var(--hud);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-radius:16px}
#hudTL{top:calc(env(safe-area-inset-top,0px) + 12px);left:calc(env(safe-area-inset-left,0px) + 12px);display:flex;gap:8px;align-items:stretch}
.big{padding:10px 16px 10px 14px}
.big .v{font-family:var(--display);font-weight:700;font-size:44px;line-height:1;font-variant-numeric:tabular-nums}
.big .u{font-size:12px;color:var(--hud-dim);margin-top:4px}
.stack{display:grid;gap:6px}
.mini{padding:7px 12px;min-width:92px}
.mini .v{font-family:var(--display);font-weight:500;font-size:20px;font-variant-numeric:tabular-nums;line-height:1.1}
.mini .u{font-size:11.5px;color:var(--hud-dim)}
#grade{display:flex;flex-direction:column;justify-content:center;align-items:center;padding:8px 14px;border-radius:16px;min-width:84px;transition:background .4s}
#grade .v{font-family:var(--display);font-weight:700;font-size:28px;line-height:1}
#grade .u{font-size:11.5px;opacity:.85;margin-top:3px;white-space:nowrap}
#hrBox{display:flex;flex-direction:column;justify-content:center;transition:background .4s}
#hrBox .v::before{content:'\2665';font-size:.7em;margin-right:5px;vertical-align:.08em}
#hudTR{top:calc(env(safe-area-inset-top,0px) + 12px);right:calc(env(safe-area-inset-right,0px) + 12px);display:grid;gap:8px;justify-items:end}
#mini{width:150px;height:150px;border-radius:16px;display:block}
#raceInfo{padding:8px 12px;font-size:13px;text-align:right;min-width:150px}
#raceInfo .v{font-family:var(--display);font-weight:500;font-size:18px}
#board{left:calc(env(safe-area-inset-left,0px) + 12px);top:50%;transform:translateY(-50%);padding:8px 10px;font-size:13px;min-width:190px}
#board ol{list-style:none;margin:0;padding:0;display:grid;gap:3px}
#board li{display:grid;grid-template-columns:18px 1fr auto;gap:8px;align-items:center;padding:3px 4px;border-radius:8px}
#board li.me{background:rgba(195,50,59,.55)}
#board .dot{width:10px;height:10px;border-radius:50%}
#board .gap{color:var(--hud-dim);font-variant-numeric:tabular-nums}
#hudB{left:calc(env(safe-area-inset-left,0px) + 12px);right:calc(env(safe-area-inset-right,0px) + 12px);bottom:calc(env(safe-area-inset-bottom,0px) + 12px);display:flex;gap:8px;align-items:flex-end}
#profile{flex:1;height:64px;border-radius:14px;display:block;min-width:0}
.ctrls{display:flex;gap:8px;pointer-events:auto}
.ib{width:48px;height:48px;border-radius:14px;border:0;background:var(--hud);color:var(--hud-ink);display:grid;place-items:center;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.ib svg{width:22px;height:22px}
.ib[aria-pressed="true"]{background:var(--apple)}
.voice{border-top:1px solid var(--line);margin-top:14px;padding-top:12px}
.voice-title{font-family:var(--display);font-weight:500;font-size:15px;margin:0 0 4px}
#demo{right:calc(env(safe-area-inset-right,0px) + 12px);bottom:calc(env(safe-area-inset-bottom,0px) + 88px);padding:10px 12px;pointer-events:auto;width:220px;font-size:13px}
#demo input{width:100%;accent-color:var(--apple)}
#demo .row{display:flex;justify-content:space-between;align-items:baseline}
#gear{right:calc(env(safe-area-inset-right,0px) + 12px);bottom:calc(env(safe-area-inset-bottom,0px) + 88px);padding:8px;pointer-events:auto;display:flex;align-items:center;gap:8px;font-size:13px}
#gear button{width:40px;height:40px;border-radius:12px;border:0;background:rgba(255,255,255,.14);color:#fff;font-size:20px}
#gear .v{font-family:var(--display);font-size:16px;min-width:64px;text-align:center}
#toast{left:50%;top:calc(env(safe-area-inset-top,0px) + 14px);transform:translateX(-50%);padding:8px 14px;font-size:14px;border-radius:999px;opacity:0;transition:opacity .3s}
#toast.show{opacity:1}
#tags{position:fixed;inset:0;z-index:5;pointer-events:none;overflow:hidden}
.tag3d{position:absolute;left:0;top:0;transform-origin:0 0;color:#F3F6F9;background:rgba(11,17,24,.66);border-left:3px solid #fff;border-radius:9px;padding:4px 8px 5px;font-size:12px;line-height:1.3;white-space:nowrap;will-change:transform}
.tag3d .nm{font-weight:600;font-size:11.5px;color:#C9D3DD;margin-bottom:1px}
.tag3d .r{display:flex;align-items:baseline;gap:4px}
.tag3d b{font-family:var(--display);font-weight:500;font-size:13px;font-variant-numeric:tabular-nums;min-width:28px;text-align:right}
.tag3d span{color:#A9B6C4;font-size:11px}
.tag3d .ahead{color:#F2B25C}
.tag3d .behind{color:#8FD19E}
#count{inset:0;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:min(30vw,220px);text-shadow:0 6px 40px rgba(0,0,0,.5)}

/* ---------- overlays ---------- */
.modal{position:fixed;inset:0;z-index:30;display:grid;place-items:center;background:rgba(6,10,14,.55);padding:20px}
.card{background:var(--panel);color:var(--ink);border-radius:20px;padding:22px;width:min(460px,100%);max-height:90%;overflow:auto}
.card h3{font-family:var(--display);font-weight:500;font-size:22px;margin:0 0 4px}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:16px 0}
.stat{background:var(--soft);border-radius:12px;padding:10px 12px}
.stat .v{font-family:var(--display);font-size:20px;font-weight:500}
.stat .u{font-size:12.5px;color:var(--muted)}
.res{list-style:none;padding:0;margin:0;display:grid;gap:4px;font-size:14px}
.res li{display:grid;grid-template-columns:22px 1fr auto;gap:8px;padding:6px 8px;border-radius:8px}
.steps{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:8px}
.steps li{display:grid;grid-template-columns:22px 1fr 1fr 32px;gap:6px 8px;align-items:center;font-size:13px;background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:8px}
.steps .n{grid-row:1/3}
.steps .g{grid-column:2/4}
.steps .x{grid-column:4;grid-row:1}
.steps .c{grid-column:2;grid-row:2}
.steps .m{grid-column:3;grid-row:2}
.steps .n{color:var(--muted);text-align:center}
.steps .g,.gearpick{display:flex;align-items:center;gap:4px}
.steps select,.gearpick select,.steps input{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:6px 4px;min-width:0}
.steps label{display:flex;align-items:center;gap:4px;color:var(--muted)}
.steps input{width:100%;color:var(--ink)}
.steps .x{border:0;background:transparent;color:var(--muted);font-size:20px;line-height:1;height:32px}
.steps .g select{flex:1}
.steps label span{white-space:nowrap}
#planBox{left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 86px);width:min(330px,calc(100% - 24px));padding:10px 12px}
#planBox .ph{display:flex;justify-content:space-between;font-size:12.5px;color:var(--hud-dim)}
#planBox .pm{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:6px 0;text-align:center}
#planBox .v{font-family:var(--display);font-weight:700;font-size:24px;line-height:1.1;font-variant-numeric:tabular-nums}
#planBox .u{font-size:11px;color:var(--hud-dim)}
#planBox .v.ok{color:#8FD19E} #planBox .v.near{color:#F2C14E} #planBox .v.off{color:#FF7A6E}
#planBox .pbar{height:5px;border-radius:3px;background:rgba(255,255,255,.18);overflow:hidden}
#planBox .pbar i{display:block;height:100%;width:0;background:var(--amber)}
#planBox .pn{font-size:12.5px;color:var(--hud-dim);margin-top:6px}
@media (max-height:520px){ #planBox{bottom:calc(env(safe-area-inset-bottom,0px) + 74px);padding:6px 10px} #planBox .v{font-size:19px} #planBox .pn{display:none} }
.card.wide{width:min(580px,100%)}
.card h4{font-family:var(--display);font-weight:500;font-size:14px;margin:20px 0 8px}
.stats.four{grid-template-columns:repeat(4,minmax(0,1fr))}
.stats.five{grid-template-columns:repeat(5,minmax(0,1fr));margin:0}
.stats.five .v{font-size:16px}
@media (max-width:560px){ .stats.four{grid-template-columns:repeat(2,minmax(0,1fr))} .stats.five{grid-template-columns:repeat(3,minmax(0,1fr))} }
.rrow{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.rrow small,.hist small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.rrow .rv{text-align:right;font-family:var(--display);font-size:16px;font-variant-numeric:tabular-nums}
.rrow .rv small{font-family:var(--body)}
.hist{list-style:none;margin:0;padding:0;display:grid;gap:2px;font-size:13.5px}
.hist li{display:grid;grid-template-columns:auto 1fr auto;gap:10px;padding:7px 0;border-bottom:1px solid var(--line)}
.hist li > span:first-child{color:var(--muted);white-space:nowrap}
.hist li > span:last-child{text-align:right;font-variant-numeric:tabular-nums}
.hist li.empty{display:block;color:var(--muted)}
.newrec{background:color-mix(in srgb,var(--amber) 18%,transparent);border:1px solid var(--amber);border-radius:12px;padding:10px 12px;margin-top:12px;font-size:14px}
.newrec ul{margin:6px 0 0;padding-left:18px;display:grid;gap:3px}
#btnRecords{margin:-8px 0 4px}
.res li.me{background:color-mix(in srgb,var(--apple) 18%,transparent)}
.row2{display:flex;gap:8px;margin-top:16px}
.row2 .btn{flex:1}
.strava-note{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;border:1px solid var(--line);background:var(--panel);border-radius:14px;padding:10px 14px;margin:0 0 16px;max-width:760px}
/* Strava's brand: the "Connect with Strava" button and the orange "View on Strava" link */
.strava-btn{display:inline-flex;align-items:center;gap:8px;height:48px;padding:0 16px;border-radius:6px;background:#FC4C02;color:#fff;font-weight:600;text-decoration:none;white-space:nowrap}
.strava-btn svg{width:20px;height:20px}
.strava-link{color:#FC5200;font-weight:600}

/* photo mode */
#photoUI{position:fixed;z-index:25;right:calc(env(safe-area-inset-right,0px) + 12px);top:calc(env(safe-area-inset-top,0px) + 12px);
  width:min(300px,calc(100% - 24px));max-height:calc(100% - 24px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));overflow:auto;
  background:rgba(11,17,24,.72);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);color:#F3F6F9;border-radius:18px;padding:14px}
#photoUI h3{font-family:var(--display);font-weight:500;font-size:16px;margin:0 0 4px}
#photoUI p{margin:0 0 10px;font-size:12.5px;color:#A9B6C4;line-height:1.45}
.seg{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;margin:8px 0}
.seg button{border:1px solid rgba(255,255,255,.18);background:transparent;color:#F3F6F9;border-radius:10px;padding:7px 6px;font-size:13px}
.seg button[aria-pressed="true"]{background:#F3F6F9;color:#0B1118}
.sl{display:grid;grid-template-columns:1fr auto;gap:2px 8px;font-size:12.5px;margin:8px 0;color:#C9D3DD}
.sl input{grid-column:1/-1;width:100%;accent-color:var(--apple)}
.chk{display:flex;gap:8px;align-items:center;font-size:13px;margin:8px 0}
#photoUI .btn{width:100%;margin-top:8px;background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.2);color:#F3F6F9}
#photoUI .btn.primary{background:var(--apple);border-color:var(--apple);font-size:15px;padding:12px}
#stamp{position:fixed;z-index:9;left:calc(env(safe-area-inset-left,0px) + 18px);bottom:calc(env(safe-area-inset-bottom,0px) + 18px);
  color:#F4F4F0;font:600 15px/1.35 'Golos Text',monospace;text-shadow:0 1px 2px #000;pointer-events:none;letter-spacing:.03em}
#stamp .rec{color:#ff3b3b}
#shot{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.86);display:grid;place-items:center;padding:16px;
  padding-top:calc(env(safe-area-inset-top,0px) + 16px);padding-bottom:calc(env(safe-area-inset-bottom,0px) + 16px)}
#shot img{max-width:100%;max-height:78vh;border-radius:10px;display:block}
#shot p{color:#C9D3DD;font-size:13px;text-align:center;margin:10px 0}
#loading{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:#0B1118;color:#E7ECF1;font-family:var(--display);font-size:18px}
@media (max-width:760px), (max-height:520px){
  .big .v{font-size:34px}
  .mini{min-width:78px;padding:6px 10px}
  .mini .v{font-size:17px}
  #mini{width:112px;height:112px}
  #board{font-size:12px;min-width:160px;top:auto;bottom:calc(env(safe-area-inset-bottom,0px) + 86px);transform:none}
  #raceInfo{min-width:112px;font-size:12px}
  #profile{height:52px}
  .ib{width:44px;height:44px}
}
@media (max-height:520px){ #board{display:none} }
@media (prefers-reduced-motion: reduce){ #grade{transition:none} }
</style>
</head>
<body>
<canvas id="gl" data-t-label="a11y.view3d"></canvas>
<div id="loading" data-t="loading">…</div>

<!-- ======== СТРАНИЦА 1: НАСТРОЙКИ ======== -->
<div id="menu" class="page" role="main" data-t-label="a11y.setup">
  <header class="topbar">
    <div class="brand"><svg width="44" height="28" viewBox="0 0 54 34" aria-hidden="true"><path d="M2 32 L16 10 L22 18 L30 4 L52 32 Z" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"/><path d="M26 10 L30 4 L34 10 L31 9 L29 11 Z" fill="currentColor"/><circle cx="44" cy="9" r="4" fill="#C3323B"/></svg><h1 data-t="brand"></h1></div>
    <button class="btn" id="btnRecords" type="button" data-t="records.title"></button>
  </header>
  <div class="setup"><div class="setup-in">
    <p class="lead" data-t="lead"></p>
    <p class="strava-note hidden" id="stravaNote"></p>
    <div class="grid">
      <section class="box wide" aria-labelledby="hRoute">
        <h2 id="hRoute"><span class="num">1</span><span data-t="sec.route"></span></h2>
        <div class="cities" id="cities"></div>
        <div class="routes" id="routes"></div>
      </section>
      <section class="box" aria-labelledby="hMode">
        <h2 id="hMode"><span class="num">2</span><span data-t="sec.mode"></span></h2>
    <div class="cities" id="modeSeg"><button class="city" type="button" data-mode="race" data-t="mode.raceBots"></button><button class="city" type="button" data-mode="plan" data-t="mode.plan"></button><button class="city" type="button" data-mode="free" data-t="mode.free"></button></div>
    <div id="raceOpts"><div class="field"><label for="bots" data-t="race.bots"></label>
      <select id="bots"><option value="0" data-t="bots.none"></option><option value="3" data-t="bots.3"></option><option value="6" selected data-t="bots.6"></option><option value="10" data-t="bots.10"></option></select></div>
    <div class="field"><label for="level" data-t="race.level"></label>
      <select id="level"><option value="easy" data-t="level.easy"></option><option value="mid" selected data-t="level.mid"></option><option value="hard" data-t="level.hard"></option></select></div></div>
    <div id="planEd" class="hidden">
      <p class="hint" data-t="plan.hint"></p>
      <div class="field"><label data-t="plan.startGear"></label><span class="gearpick"><select id="plStartF" data-t-label="plan.startFront"></select><span>×</span><select id="plStartR" data-t-label="plan.startRear"></select></span></div>
      <ol class="steps" id="plSteps"></ol>
      <div class="row2"><button class="btn" id="plAdd" type="button" data-t="plan.add"></button><button class="btn" id="plTpl" type="button" data-t="plan.example"></button></div>
      <p class="hint" id="plTotal"></p>
    </div>

      </section>
      <section class="box" aria-labelledby="hRider">
        <h2 id="hRider"><span class="num">3</span><span data-t="sec.rider"></span></h2>
        <canvas id="charPrev" data-t-label="a11y.riderPreview"></canvas>
    <div class="field"><label for="height" data-t="body.height"></label><input id="height" type="number" min="120" max="220" step="1" value="178" inputmode="numeric"></div>
<div class="field"><label for="mass" data-t="body.mass"></label><input id="mass" type="number" min="35" max="160" step="1" value="75" inputmode="numeric"></div>
<p class="hint" id="bodyHint"></p>
    <div class="field"><label for="view" data-t="view.label"></label>
      <select id="view"><option value="chase" selected data-t="view.third"></option><option value="fpv" data-t="view.first"></option></select></div>

      </section>
      <section class="box wide" aria-labelledby="hMp">
        <h2 id="hMp"><span class="num">4</span><span data-t="sec.friends"></span></h2>
        <p class="hint" id="mpStatus" data-t="mp.connecting"></p>
        <div class="mp-online" id="mpOnline"></div>
        <div class="mp-groups" id="mpGroups"></div>
        <p class="hint hidden" id="mpNote" role="status"></p>
        <div class="mp-create"><select id="mpDelay" data-t-label="mp.delay"><option value="30"></option><option value="60" selected></option><option value="120"></option><option value="300"></option><option value="900"></option><option value="1800"></option><option value="3600"></option></select><button class="btn" id="mpCreate" type="button" disabled data-t="mp.create"></button></div>
        <p class="hint" data-t="mp.hint"></p>
        <div class="voice hidden" id="voiceBox">
          <h3 class="voice-title" data-t="voice.title"></h3>
          <p class="hint" data-t="voice.hint"></p>
          <div class="mp-create"><button class="btn" id="voiceJoin" type="button"></button><button class="btn hidden" id="voiceMute" type="button"></button></div>
          <p class="hint" id="voiceWho" role="status"></p>
        </div>
      </section>
      <section class="box wide" aria-labelledby="hDev">
        <h2 id="hDev"><span class="num">5</span><span data-t="sec.devices"></span></h2>
        <div class="cols">
          <div>
    <button class="btn" id="btnConnect" type="button" data-t="dev.connect"></button>
    <ul class="devlist" id="devList"></ul>
    <p class="hint" id="btHint" data-t="bt.default"></p>
    <div class="field"><label for="difficulty" data-t="trainer.difficulty"></label>
      <select id="difficulty"><option value="0" data-t="diff.0"></option><option value="25">25%</option><option value="50" selected>50%</option><option value="75">75%</option><option value="100" data-t="diff.100"></option></select></div>
    <div class="field"><label for="hrmax" data-t="body.hrmax"></label><input id="hrmax" type="number" min="120" max="230" step="1" value="185" inputmode="numeric"></div>

          </div>
          <div>
    <div class="field"><label for="bikeType" data-t="bike.type"></label><select id="bikeType"></select></div>
    <div class="field"><label for="bikeKg" data-t="bike.kg"></label><input id="bikeKg" type="number" min="5" max="30" step="0.1" value="8.5" inputmode="decimal"></div>
    <div class="field"><label for="circ" data-t="bike.wheel"></label>
      <select id="circ">
        <option value="2096" data-tyre="700×23C"></option>
        <option value="2105" selected data-tyre="700×25C"></option>
        <option value="2136" data-tyre="700×28C"></option>
        <option value="2155" data-tyre="700×32C"></option>
        <option value="2200" data-tyre="700×40C"></option>
        <option value="2288" data-tyre="29×2.1"></option>
        <option value="2148" data-tyre="27.5×2.1"></option>
        <option value="2068" data-tyre="26×2.1"></option>
      </select></div>
    <div class="field"><label for="trainer" data-t="trainer.label"></label>
      <select id="trainer">
        <option value="fluid" selected data-t="trainer.fluid"></option>
        <option value="mag" data-t="trainer.mag"></option>
        <option value="rollers" data-t="trainer.rollers"></option>
      </select></div>
    <div class="field"><label for="plFront" data-t="bike.front"></label><select id="plFront"></select></div>
    <div class="field hidden" id="plFrontCustomF"><label for="plFrontCustom" data-t="bike.frontCustom"></label><input id="plFrontCustom" placeholder="50-34" inputmode="numeric"></div>
    <div class="field"><label for="plCass" data-t="bike.cass"></label><select id="plCass"></select></div>
    <div class="field hidden" id="plCassCustomF"><label for="plCassCustom" data-t="bike.cassCustom"></label><input id="plCassCustom" placeholder="11-12-13-14-15-17-19-21-24-28" inputmode="numeric"></div>

          </div>
        </div>
      </section>
    </div>
    <p class="attr"><span data-t="attr.before"></span><a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener" data-t="attr.osm"></a><span data-t="attr.after"></span></p>

  </div></div>
  <footer class="startbar">
    <div class="sum" id="startSum"></div>
    <button class="btn primary" id="btnStart" type="button" data-t="start"></button>
  </footer>
</div>

<!-- ======== СТРАНИЦА 2: ЗАЕЗД ======== -->
<!-- ======== HUD ======== -->
<div id="hud" class="hidden">
  <div id="tags" aria-hidden="true"></div>
  <div class="hud" id="hudTL">
    <div class="panel big"><div class="v" id="vSpeed">0</div><div class="u" id="uSpeed" data-t="u.kmh"></div></div>
    <div class="stack">
      <div class="panel mini"><div class="v" id="vPower">0</div><div class="u" id="uPower" data-t="u.w"></div></div>
      <div class="panel mini"><div class="v" id="vCad">—</div><div class="u" data-t="u.rpm"></div></div>
    </div>
    <div class="panel mini hidden" id="hrBox"><div class="v" id="vHR">—</div><div class="u" id="uHR" data-t="u.bpm"></div></div>
    <div id="grade"><div class="v" id="vGrade">0%</div><div class="u" id="uGrade" data-t="hud.grade"></div></div>
  </div>
  <div class="hud" id="hudTR">
    <canvas id="mini" class="panel" width="300" height="300" data-t-label="a11y.minimap"></canvas>
    <div class="panel" id="raceInfo"><div class="v" id="vTime">0:00</div><div id="vDist"></div><div id="vEle"></div></div>
  </div>
  <div class="hud panel hidden" id="planBox">
    <div class="ph"><span id="wStep"></span><span id="wLeft"></span></div>
    <div class="pm">
      <div><div class="v" id="wGear">1×1</div><div class="u" id="wTeeth" data-t="plan.gear"></div></div>
      <div><div class="v" id="wCad">80</div><div class="u" data-t="plan.target"></div></div>
      <div><div class="v" id="wAct">0</div><div class="u" data-t="plan.yours"></div></div>
    </div>
    <div class="pbar"><i id="wProg"></i></div>
    <div class="pn" id="wNext"></div>
  </div>
  <div class="hud panel" id="board"><ol id="boardList"></ol></div>
  <div class="hud" id="hudB">
    <canvas id="profile" class="panel" data-t-label="a11y.profile"></canvas>
    <div class="ctrls">
      <button class="ib" id="btnView" type="button" data-t-label="view.toThird"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="6.5" r="2.6"/><path d="M6 20c.6-4.2 2.8-7 6-7s5.4 2.8 6 7"/><path d="M3 12l2.5-2.5M21 12l-2.5-2.5"/></svg></button>
      <button class="ib" id="btnPhoto" type="button" data-t-label="photo.title"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg></button>
      <button class="ib hidden" id="btnMic" type="button" data-t-label="voice.mic" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
      <button class="ib" id="btnPause" type="button" data-t-label="pause.title"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M9 5v14M15 5v14"/></svg></button>
    </div>
  </div>
  <div class="hud panel hidden" id="demo">
    <div class="row"><span data-t="demo.power"></span><b id="demoV"></b></div>
    <input id="demoP" type="range" min="0" max="450" step="5" value="150" data-t-label="demo.power">
  </div>
  <div class="hud panel hidden" id="gear">
    <button id="gDown" type="button" data-t-label="gear.down">−</button>
    <div><div class="v" id="gearV">50×17</div></div>
    <button id="gUp" type="button" data-t-label="gear.up">+</button>
  </div>
  <div class="hud panel" id="toast"></div>
</div>
<div class="hud hidden" id="count"></div>
<div id="stamp" class="hidden"></div>

<!-- ======== PAUSE ======== -->
<div class="modal hidden" id="pauseM">
  <div class="card">
    <h3 data-t="pause.title"></h3>
    <p class="hint" id="pauseHint" data-t="pause.race"></p>
    <div class="row2"><button class="btn" id="btnResume" type="button" data-t="pause.resume"></button><button class="btn hidden" id="btnFinish" type="button" data-t="pause.finish"></button><button class="btn" id="btnQuit" type="button" data-t="pause.quit"></button></div>
  </div>
</div>

<!-- ======== RECORDS ======== -->
<div class="modal hidden" id="recM">
  <div class="card wide" role="dialog" data-t-label="records.title">
    <h3 data-t="records.title"></h3>
    <p class="hint" id="recSync"></p>
    <div class="stats four" id="recTotals"></div>
    <h4 data-t="records.peaks"></h4>
    <div class="stats five" id="recPeaks"></div>
    <h4 data-t="records.routes"></h4>
    <div id="recRoutes"></div>
    <h4 data-t="records.recent"></h4>
    <ol class="hist" id="recHist"></ol>
    <div class="row2"><button class="btn" id="btnRecReset" type="button" data-t="records.reset"></button><button class="btn" id="btnRecClose" type="button" data-t="close"></button></div>
  </div>
</div>

<!-- ======== RESULTS ======== -->
<div class="modal hidden" id="resM">
  <div class="card">
    <h3 id="resTitle"></h3>
    <p class="hint" id="resSub"></p>
    <div class="newrec hidden" id="resRec"></div>
    <p class="hint hidden" id="resStrava" role="status"></p>
    <div class="stats" id="resStats"></div>
    <ol class="res" id="resList"></ol>
    <div class="row2"><button class="btn" id="btnAgain" type="button" data-t="res.again"></button><button class="btn" id="btnMenu" type="button" data-t="res.menu"></button></div>
  </div>
</div>

<!-- ======== PHOTO MODE ======== -->
<div id="photoUI" class="hidden">
  <h3 data-t="photo.title"></h3>
  <p data-t="photo.hint"></p>
  <div class="seg" id="camSeg"><button type="button" data-cam="fpv" aria-pressed="true" data-t="view.first"></button><button type="button" data-cam="orbit" aria-pressed="false" data-t="photo.side"></button></div>
  <div class="seg" id="lookSeg"><button type="button" data-look="bodycam" data-t="look.bodycam"></button><button type="button" data-look="clean" data-t="look.clean"></button><button type="button" data-look="film" data-t="look.film"></button><button type="button" data-look="noir" data-t="look.noir"></button></div>
  <div class="sl"><span data-t="photo.fov"></span><b id="oFov"></b><input type="range" id="pFov" min="40" max="120" step="1"></div>
  <div class="sl"><span data-t="photo.dist"></span><b id="oDist"></b><input type="range" id="pDist" min="0" max="1.2" step="0.05"></div>
  <div class="sl"><span data-t="photo.ca"></span><b id="oCA"></b><input type="range" id="pCA" min="0" max="0.03" step="0.001"></div>
  <div class="sl"><span data-t="photo.grain"></span><b id="oGrain"></b><input type="range" id="pGrain" min="0" max="0.25" step="0.01"></div>
  <div class="sl"><span data-t="photo.vig"></span><b id="oVig"></b><input type="range" id="pVig" min="0" max="1" step="0.05"></div>
  <div class="sl"><span data-t="photo.exp"></span><b id="oExp"></b><input type="range" id="pExp" min="0.5" max="1.6" step="0.02"></div>
  <label class="chk"><input type="checkbox" id="pStamp" checked> <span data-t="photo.stamp"></span></label>
  <label class="chk"><input type="checkbox" id="pHud"> <span data-t="photo.hud"></span></label>
  <button class="btn primary" id="btnSnap" type="button" data-t="photo.snap"></button>
  <button class="btn" id="btnPhotoExit" type="button" data-t="photo.exit"></button>
</div>
<div id="shot" class="hidden">
  <div>
    <img id="shotImg" alt="" data-t-alt="photo.shotAlt">
    <p data-t="photo.save"></p>
    <div class="row2"><button class="btn" id="btnShotClose" type="button" data-t="close"></button></div>
  </div>
</div>

// Хранилище в браузере (IndexedDB): файл бывает в несколько мегабайт, localStorage столько не вмещает
const IDB = {
  db: null,
  open() { return new Promise((res, rej) => { try { const r = indexedDB.open('alatau', 1); r.onupgradeneeded = () => r.result.createObjectStore('kv'); r.onsuccess = () => res(this.db = r.result); r.onerror = () => rej(r.error); } catch (e) { rej(e); } }); },
  async op(mode, fn) { const db = this.db || await this.open(); return new Promise((res, rej) => { const st = db.transaction('kv', mode).objectStore('kv'), rq = fn(st); rq.onsuccess = () => res(rq.result); rq.onerror = () => rej(rq.error); }); },
  get(k) { return this.op('readonly', s => s.get(k)); }, set(k, v) { return this.op('readwrite', s => s.put(v, k)); }, del(k) { return this.op('readwrite', s => s.delete(k)); }
};
let OSM = null;
function validOSM(d) { return d && d.v === 1 && d.routes && typeof d.routes === 'object'; }
function applyOSM(d) {
  OSM = validOSM(d) ? d : null;
  ROUTES.forEach(r => { const x = OSM && OSM.routes[r.id]; r.osm = x && Array.isArray(x.path) && x.path.length > 3 ? x : null; });

// Подготовка зданий: метры, центр, радиус и сетка для быстрых проверок
function prepOSM(arr) {
  const list = [], g = new Map(), cell = 40;
  (arr || []).forEach(a => {
    if (!Array.isArray(a) || a.length < 8) return;
    const h = a[0] / 10, mh = a[1] / 10; if (mh > .5) return; // части зданий на высоте пропускаем
    const ring = []; for (let i = 2; i + 1 < a.length; i += 2) ring.push([a[i] / 10, a[i + 1] / 10]);
    if (ring.length < 3) return;
    let cx = 0, cz = 0; ring.forEach(p => { cx += p[0]; cz += p[1]; }); cx /= ring.length; cz /= ring.length;
    let r = 0; ring.forEach(p => { r = Math.max(r, Math.hypot(p[0] - cx, p[1] - cz)); });
    const b = { ring, h: clamp(h, 3, 320), cx, cz, r }; list.push(b);
    const k = Math.floor(cx / cell) + ',' + Math.floor(cz / cell); (g.get(k) || g.set(k, []).get(k)).push(b);
  });
  return {
    list,
    hit(x, z) { const ci = Math.floor(x / cell), cj = Math.floor(z / cell); for (let a = -2; a <= 2; a++) for (let d = -2; d <= 2; d++) { const L = g.get((ci + a) + ',' + (cj + d)); if (L) for (const b of L) if (Math.hypot(b.cx - x, b.cz - z) < b.r + 1.5) return true; } return false; }
  };
}
// Все здания маршрута — одна геометрия: стены, крыша, цвет фасада в вершинах
function addOSMBuildings(grp, T, W, lms, osmB) {
  const cell = 30, rg = new Map();
  for (let i = 0; i < T.N; i += 2) { const k = Math.floor(T.X[i] / cell) + ',' + Math.floor(T.Z[i] / cell); (rg.get(k) || rg.set(k, []).get(k)).push(i); }

    if (b.ring.some(p => roadD(p[0], p[1]) < W / 2 + 5.5)) return;                    // ничего на проезжей части и тротуаре

    let area = 0; const R0 = b.ring; for (let i = 0; i < R0.length; i++) { const p = R0[i], q = R0[(i + 1) % R0.length]; area += p[0] * q[1] - q[0] * p[1]; }

}

const Work = {

  }

// One connection to Cloudflare's media server: the microphone goes up as one track, the other riders'

function mpStepRemote(b, dt) {

// итоги групповой гонки с сервера: время тех, кто финишировал, и тех, кто ещё едет
async function mpPollResults(gid, until) {

  MP.resultsFor = gid;
  try {
    const res = await Site.get('/groups/' + gid + '/results'), myId = Records.me && Records.me.user_id;
    const done = new Set(res.finished.map(f => f.user_id));
    const list = res.finished.map(f => ({ name: f.user_id === myId ? t('you') : f.name, t: f.duration_s, me: f.user_id === myId, color: f.user_id === myId ? hexs(kitted(charById(settings.char)).a) : hexs(mpColor(f.user_id)), human: f.user_id !== myId }));
    if (!done.has(myId) && me.finishT != null) list.push({ name: t('you'), t: me.finishT, me: true, color: hexs(kitted(charById(settings.char)).a) });
    bots.filter(b => b.remote && !done.has(b.uid)).forEach(b => list.push({ name: b.name, t: raceT + (world.FIN - b.s) / Math.max(b.v, 2), color: hexs(b.color), est: true, human: true }));
    list.sort((a, b) => a.t - b.t); renderRaceList(list);
    if (bots.some(b => b.remote && !done.has(b.uid))) setTimeout(() => mpPollResults(gid, until), 2000); else MP.resultsFor = null;

}

let drag = null, pinch = null;
const glEl = document.getElementById('gl');
glEl.addEventListener('pointerdown', e => { if (!photo) return; drag = { x: e.clientX, y: e.clientY, id: e.pointerId }; glEl.setPointerCapture(e.pointerId); });
glEl.addEventListener('pointermove', e => {
  if (!photo || !drag || drag.id !== e.pointerId) return; const dx = (e.clientX - drag.x) / innerWidth, dy = (e.clientY - drag.y) / innerHeight; drag.x = e.clientX; drag.y = e.clientY;
  if (cam.mode === 'orbit') { cam.oyaw -= dx * 4; cam.opitch = clamp(cam.opitch + dy * 3, -.1, 1.4); } else { cam.yaw = clamp(cam.yaw - dx * 2.4, -1.6, 1.6); cam.pitch = clamp(cam.pitch - dy * 1.6, -.8, .8); }

glEl.addEventListener('touchmove', e => { if (photo && pinch && e.touches.length === 2) { const d = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY); if (cam.mode === 'orbit') cam.dist = clamp(cam.dist * pinch / d, 2.5, 40); else { look.fov = clamp(look.fov * pinch / d, 40, 120); camera.fov = look.fov; camera.updateProjectionMatrix(); syncPhotoUI(); } pinch = d; } }, { passive: true });

/* ---------------- Меню ---------------- */
function sparkline(cv, route) {
  const T = buildTrack(route), dpr = 2, g = cv.getContext('2d'); cv.width = 96 * dpr; cv.height = 38 * dpr;
  const o = {}, ys = []; let mn = 1e9, mx = -1e9; for (let i = 0; i <= 60; i++) { const y = sampleAt(T, T.L * i / 60, o).y; ys.push(y); mn = Math.min(mn, y); mx = Math.max(mx, y); }
  const r = Math.max(40, mx - mn); g.beginPath(); g.moveTo(0, cv.height);
  ys.forEach((y, i) => g.lineTo(i / 60 * cv.width, cv.height - 3 - (y - mn) / r * (cv.height - 8))); g.lineTo(cv.width, cv.height); g.closePath();
  g.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--apple').trim() || '#C3323B'; g.globalAlpha = .85; g.fill();
  return T;
}
